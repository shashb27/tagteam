<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="TagTeam — Tag your expert in. Stop playing telephone with your AI.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="300" rx="20" fill="url(#bg)"/>
  <circle cx="1130" cy="30" r="115" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.35"/>
  <circle cx="1185" cy="205" r="70" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.3"/>

  <!-- motif: one shared session bubble, two people inside -->
  <g>
    <rect x="64" y="58" width="222" height="158" rx="26" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <path d="M118 216 L100 246 L156 216 Z" fill="#1e293b"/>

    <!-- avatar 1 (host) -->
    <circle cx="150" cy="120" r="27" fill="#22d3ee"/>
    <circle cx="150" cy="111" r="9.5" fill="#0f172a"/>
    <path d="M133 139 a17 13 0 0 1 34 0 Z" fill="#0f172a"/>

    <!-- avatar 2 (tagged-in expert) -->
    <circle cx="200" cy="120" r="27" fill="#a78bfa" stroke="#1e293b" stroke-width="4"/>
    <circle cx="200" cy="111" r="9.5" fill="#0f172a"/>
    <path d="M183 139 a17 13 0 0 1 34 0 Z" fill="#0f172a"/>

    <!-- live typing dots -->
    <circle cx="151" cy="182" r="5.5" fill="#22d3ee"/>
    <circle cx="175" cy="182" r="5.5" fill="#64748b"/>
    <circle cx="199" cy="182" r="5.5" fill="#64748b"/>

    <!-- invite chip -->
    <rect x="240" y="40" width="78" height="32" rx="16" fill="#fbbf24"/>
    <text x="279" y="61" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0f172a">+ tag in</text>
  </g>

  <!-- wordmark -->
  <text x="352" y="90" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#fbbf24">MULTIPLAYER CLAUDE SESSIONS</text>
  <text x="352" y="168" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="78" font-weight="800"><tspan fill="#22d3ee">Tag</tspan><tspan fill="#e2e8f0">Team</tspan></text>
  <rect x="354" y="184" width="130" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="352" y="230" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="23"><tspan fill="#cbd5e1">Tag your expert in.</tspan><tspan fill="#94a3b8"> Stop playing telephone with your AI.</tspan></text>
</svg>
