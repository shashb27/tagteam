name: ci
on: [push, pull_request]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - name: Build better-sqlite3 from source (prebuilt binary segfaults on this glibc)
        run: |
          cd node_modules/better-sqlite3
          npx --yes node-gyp rebuild --release --force_build=1
          rm -rf prebuilds
        env:
          npm_config_python: python3
      - run: npm run lint
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - name: Build better-sqlite3 from source (prebuilt binary segfaults on this glibc)
        run: |
          cd node_modules/better-sqlite3
          npx --yes node-gyp rebuild --release --force_build=1
          rm -rf prebuilds
        env:
          npm_config_python: python3
      - run: npm run test:unit

  e2e-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - name: Build better-sqlite3 from source (prebuilt binary segfaults on this glibc)
        run: |
          cd node_modules/better-sqlite3
          npx --yes node-gyp rebuild --release --force_build=1
          rm -rf prebuilds
        env:
          npm_config_python: python3
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci --omit=dev
      - name: Build better-sqlite3 from source (prebuilt binary segfaults on this glibc)
        run: |
          cd node_modules/better-sqlite3
          npx --yes node-gyp rebuild --release --force_build=1
          rm -rf prebuilds
        env:
          npm_config_python: python3
      - run: tar czf tagteam.tgz server web package.json
      - uses: actions/upload-artifact@v4
        with:
          name: tagteam
          path: tagteam.tgz

  # NOTE: e2e-real (live opencode provider round-trip) is intentionally not
  # wired yet. It is gated on the `OPENCODE_PROVIDER` repository secret being
  # configured. Add a job that runs `npm run test:e2e:real` once that secret
  # exists.
